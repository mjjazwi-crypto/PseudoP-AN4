<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0609" id="tc">
<meta name="description" content="Pseudoscience × Medical Capsule — اختبار عملي تشريح: تعرّف على التراكيب المرقّمة في الصور التشريحية.">
<title>Pseudoscience × Medical Capsule | Anatomy Practical Quiz</title>
<link rel="icon" href="favicon.png" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Space+Grotesk:wght@500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme=pseudo]{
  --bg:#0a0609;--card:#150b12;--line:#3b1b27;--a1:#c1182c;--a2:#6c0a18;--hi:#e0b45c;
  --tx:#f5ecee;--mu:#bda7ae;--ok:#3fd6a0;--bad:#ff5a76;--star:#f0c36a;
  --cover:#14070d;--covertx:#f0c36a;--reveal:#2a1119;--cur:#ff2740;--curbg:#2a0b14;--curtx:#fff;
  --glow1:#d3172f;--glow2:#5b8cff;--btntx:#fff;--btnbd:#e0b45c;--cardtop:#d3172f;--h3:#e0b45c;
  --ag:#e0b45c;--agon:#ff2740;--ok-bg:#3fd6a022;--ok-tx:#c9ffe9;--bad-bg:#ff5a7622;--bad-tx:#ffd7de;
  color-scheme:dark;
}
:root[data-theme=medical]{
  --bg:#070b1f;--card:#0f1636;--line:#232c5c;--a1:#ff2d6f;--a2:#2b6bff;--hi:#3fd0ff;
  --tx:#eef1ff;--mu:#9aa5d6;--ok:#22d3a0;--bad:#ff4d6d;--star:#ffc933;
  --cover:#0b1230;--covertx:#fff;--reveal:#14204a;--cur:#ff2d6f;--curbg:#1d1033;--curtx:#fff;
  --glow1:#ff2d6f;--glow2:#2b6bff;--btntx:#fff;--btnbd:transparent;--cardtop:#ff2d6f;--h3:#eef1ff;
  --ag:#3fd0ff;--agon:#ff2d6f;--ok-bg:#22d3a022;--ok-tx:#c7ffe9;--bad-bg:#ff4d6d22;--bad-tx:#ffd7de;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--glow1) 16%,transparent),transparent),
    radial-gradient(900px 500px at 10% 110%,color-mix(in srgb,var(--glow2) 14%,transparent),transparent),
    var(--bg);
  color:var(--tx);
  font:16px/1.6 Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
  overflow-y:scroll;
}
.w{max-width:860px;margin:auto;padding:14px 18px 110px}
.en{font-family:'Space Grotesk',Cairo,sans-serif;direction:ltr;unicode-bidi:isolate}
img{max-width:100%}
button{font:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* ---- identity: header + lockup ---- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;
  background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:16px}
:root[data-theme=pseudo] .top{border-color:var(--hi)}
.lock{display:flex;align-items:center;gap:8px;direction:ltr}
.lock img{display:block;border-radius:50%;object-fit:cover;background:#000;border:2px solid var(--hi)}
.lock .x{color:var(--mu);font:700 16px/1 'Space Grotesk',sans-serif}
.top .lock img{width:42px;height:42px}
.top .names{flex:1;min-width:150px;direction:ltr;text-align:left;line-height:1.2}
.top .names b{display:block;font:700 15px/1.2 'Space Grotesk',sans-serif;letter-spacing:.02em}
.top .names small{color:var(--mu);font:500 12px 'Space Grotesk',sans-serif}
.themes{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.themes button{background:none;border:0;color:var(--mu);padding:6px 12px;cursor:pointer;min-height:38px;font:600 12.5px 'Space Grotesk',Cairo,sans-serif;direction:ltr}
.themes button[aria-pressed=true]{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--btntx)}
.hero{text-align:center;padding:14px 0 6px}
.hero .lock{justify-content:center;gap:14px}
.hero .lock img{width:112px;height:112px;border-width:3px;
  box-shadow:0 0 34px color-mix(in srgb,var(--glow1) 40%,transparent),0 0 52px color-mix(in srgb,var(--glow2) 30%,transparent)}
.hero .lock .x{font-size:26px}
h1{font-size:28px;font-weight:800;line-height:1.3;margin-top:10px;
  background:linear-gradient(90deg,var(--a1),var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme=pseudo] h1{font:400 2.1rem/1.2 'UnifrakturCook',Cairo,serif;background:none;color:var(--tx);-webkit-background-clip:border-box}
.collab{display:inline-block;margin-top:4px;padding:2px 14px;border:1px solid var(--hi);border-radius:999px;color:var(--hi);font:600 13px 'Space Grotesk',sans-serif;direction:ltr}
.sub{color:var(--mu)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cardtop);border-radius:16px;padding:16px;transition:.2s}
.card:hover{border-color:var(--a1);box-shadow:0 6px 24px color-mix(in srgb,var(--a1) 22%,transparent)}
.card b{display:block;font-size:19px;color:var(--h3)}
.card span{color:var(--mu);font-size:14px}
.card i{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--hi)}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mu);padding:8px 16px;cursor:pointer;min-height:36px}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--btntx)}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2));border:1px solid var(--btnbd);color:var(--btntx);font-weight:600;
  padding:11px 20px;border-radius:12px;cursor:pointer;transition:.15s;min-height:40px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.g{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn.g:hover:not(:disabled){border-color:var(--hi)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 12px}
.prog div{height:100%;background:linear-gradient(90deg,var(--a1),var(--hi));transition:width .3s}

.img{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;line-height:0}
.img img{display:block;width:100%;height:auto}
.hl{position:absolute;border:3px solid var(--hi);border-radius:8px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 27%,transparent),0 0 22px var(--hi);
  animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--hi) 7%,transparent),0 0 30px var(--hi)}}
@keyframes pulse2{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--cur) 14%,transparent),0 0 30px var(--cur)}}

/* ---- numbered cover boxes (models) : each box is exactly its rect, never bigger ---- */
.cv{position:absolute;z-index:4;box-sizing:border-box;background:var(--cover);border:1.5px solid var(--hi);border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:var(--covertx);overflow:hidden;
  font:700 10px/1 'Space Grotesk',sans-serif;direction:ltr;pointer-events:none}
.cv.mk{border-color:var(--line)}
.cv.cur{z-index:6;border-color:var(--cur);background:var(--curbg);color:var(--curtx);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cur) 40%,transparent),0 0 18px var(--cur);animation:pulse2 1.2s ease-in-out infinite}

.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.ag{opacity:.55}.ag.on,.ag.q{opacity:1}
.ag .l1{stroke:#000c;stroke-width:5px;stroke-linecap:round;fill:none}
.ag .l2{stroke:var(--ag);stroke-width:2.5px;stroke-linecap:round;fill:none}
.ag polygon{fill:var(--ag);stroke:#000c;stroke-width:1px}
.ag .dot{fill:var(--ag);stroke:#000c;stroke-width:1px}
.ag.on .l2,.ag.q .l2{stroke:var(--agon)}.ag.on polygon,.ag.q polygon,.ag.q .dot{fill:var(--agon)}
.pin{position:absolute;z-index:4;border:0;padding:0;margin:0;background:transparent;
  border-radius:8px;cursor:pointer;min-width:24px;min-height:24px;
  transition:background .15s,box-shadow .15s}
.pin:hover,.pin:focus-visible{background:color-mix(in srgb,var(--hi) 13%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--hi) 60%,transparent)}
.pin .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  min-width:22px;height:22px;padding:0 6px;border-radius:999px;
  background:color-mix(in srgb,var(--cover) 93%,transparent);border:1.5px solid var(--hi);color:var(--covertx);
  font:700 11px/1 'Space Grotesk',sans-serif;direction:ltr;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.pin.show{background:transparent;box-shadow:none;z-index:6}
.pin.show .num{opacity:0}
.pin .lbl{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;min-width:100%;max-width:min(240px,62vw);
  background:color-mix(in srgb,var(--cover) 97%,transparent);border:1.5px solid var(--hi);color:var(--covertx);
  font:600 clamp(10px,1.6vw,14px)/1.2 'Space Grotesk',sans-serif;direction:ltr;
  padding:2px 6px;border-radius:6px;white-space:normal;text-align:center;pointer-events:none;
  box-shadow:0 8px 22px #000a}
.pin.show .lbl{display:block}

/* study mode on model pages: one box = one rect, label lives INSIDE its own box */
.pin.cvp{min-width:0;min-height:0;box-sizing:border-box;overflow:hidden;border-radius:4px;
  background:var(--cover);border:1.5px solid var(--hi);color:var(--covertx);
  display:flex;align-items:center;justify-content:center;
  font:700 10px/1 'Space Grotesk',sans-serif;direction:ltr}
.pin.cvp:hover,.pin.cvp:focus-visible{background:var(--reveal);box-shadow:none}
.pin.cvp .num{position:static;transform:none;min-width:0;height:auto;padding:0;border:0;border-radius:0;background:none;font:inherit;color:inherit}
.pin.cvp .lbl{position:static;transform:none!important;width:auto;min-width:0;max-width:none;padding:0;border:0;border-radius:0;
  background:none;box-shadow:none;font:inherit;color:inherit;white-space:normal;line-height:1.1;text-align:center;flex:none;max-width:100%}
.pin.cvp.show{background:var(--reveal);border-color:var(--cur);box-shadow:none}
.pin.cvp.show .num{display:none;opacity:1}
.pin.cvp.xbx.show{background:transparent;border-color:transparent;opacity:0;pointer-events:none}

.q{font-size:20px;font-weight:800;margin:14px 0 8px}
.opts{display:grid;gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--tx);font:600 15px 'Space Grotesk',Cairo,sans-serif;
  text-align:left;direction:ltr;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--hi)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-tx)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-tx)}
.opt:disabled{cursor:default}
input.t{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--tx);font:600 16px 'Space Grotesk',sans-serif;direction:ltr}
input.t:focus{border-color:var(--hi);outline:none}
input.t:disabled{opacity:.6}
.fb{margin:12px 0;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok-t{color:var(--ok)}
.bad-t{color:var(--bad)}

.score{font-size:54px;font-weight:800;text-align:center;line-height:1.1}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.revimg{position:relative;border-radius:10px;overflow:hidden;background:#000;max-width:420px;margin-bottom:8px;line-height:0}
.revimg img{display:block;width:100%;height:auto}
.hl2{position:absolute;border:2px solid var(--hi);border-radius:6px;box-shadow:0 0 0 2px color-mix(in srgb,var(--hi) 27%,transparent)}
.rev .nm{direction:ltr;text-align:left;font-family:'Space Grotesk',Cairo,sans-serif;font-weight:600}

.nextbar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:10px;z-index:50;pointer-events:none;padding:0 12px}
.nextbar .btn{pointer-events:auto;min-width:130px;box-shadow:0 8px 28px #000c,0 0 0 2px var(--bg)}

.bd{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 6px;border-radius:999px;
  background:linear-gradient(135deg,var(--a1),var(--a2));border:2px solid #fff;color:#fff;
  font:700 12px/20px 'Space Grotesk',sans-serif;text-align:center;pointer-events:none;direction:ltr;box-shadow:0 2px 8px #000a;z-index:3}
.bd.cur{min-width:32px;height:32px;line-height:28px;font-size:15px;z-index:7;box-shadow:0 0 0 4px color-mix(in srgb,var(--cur) 40%,transparent),0 0 22px var(--cur)}
.card.soon{opacity:.55;border-style:dashed}
.card.all{border-color:var(--a1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 70px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:5px 12px;
  font:600 13px 'Space Grotesk',Cairo,sans-serif;direction:ltr;cursor:pointer;min-height:34px}
.chip.on{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 13%,transparent)}
.chip.hard{border-color:var(--a1)}
.star{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer;padding:0 4px}
.star.on{color:var(--star)}
.tag{display:inline-block;font-size:12px;color:var(--hi);margin-inline-start:6px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px 0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---- random quiz ---- */
.rnd{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:16px;border-radius:16px;
  border:1px solid var(--hi);background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 20%,var(--card)),var(--card))}
.rnd .txt{flex:1;min-width:210px}
.rnd b{display:block;font-size:20px;color:var(--h3)}
.rnd span{color:var(--mu);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.panel h3{font-size:16px;margin-bottom:10px;color:var(--h3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 small{color:var(--mu);font-weight:400;font-size:13px;margin-inline-start:auto}
.panel .hint{color:var(--mu);font-size:13px;margin-top:8px}
.secs{display:grid;gap:8px}
.sec{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:transparent;border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;color:var(--tx);cursor:pointer;min-height:48px;transition:.15s}
.sec .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:transparent}
.sec .nm2{flex:1;min-width:0}
.sec .nm2 b{font-family:'Space Grotesk',Cairo,sans-serif;font-size:15px;margin-inline-end:6px}
.sec .nm2 small,.sec>small{color:var(--mu);font-size:13px}
.sec[aria-pressed=true]{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 10%,transparent)}
.sec[aria-pressed=true] .ck{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.rchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rchip{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--tx);cursor:pointer;
  min-height:40px;padding:6px 16px;font-weight:600;transition:.15s}
.rchip[aria-pressed=true]{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:var(--btnbd);color:var(--btntx)}
input.numin{width:92px;text-align:center;padding:8px;min-height:40px}
.tgl{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:transparent;border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;color:var(--tx);cursor:pointer;margin-top:8px;min-height:48px}
.tgl .sw{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.15s}
.tgl .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--tx);transition:.15s}
.tgl[aria-pressed=true] .sw{background:var(--ok)}
.tgl[aria-pressed=true] .sw::after{inset-inline-start:19px;background:#fff}
.tgl small{color:var(--mu);display:block;font-size:12.5px}
.tgl:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--hi);cursor:pointer;padding:4px 6px;font-size:13px;text-decoration:underline}

/* ---- timer + tags ---- */
.tmr{font:700 14px 'Space Grotesk',sans-serif;direction:ltr;padding:2px 12px;border:1px solid var(--hi);border-radius:999px;color:var(--hi);min-width:48px;text-align:center}
.tmr.low{color:var(--bad);border-color:var(--bad)}
.tprog{height:4px;margin-top:-6px}
.tprog div{transition:width .2s linear;background:linear-gradient(90deg,var(--bad),var(--hi))}
.stag{display:inline-block;padding:1px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mu);font-size:12.5px;margin-top:10px}

/* ---- results ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px/1.2 'Space Grotesk',sans-serif;direction:ltr}
.stat span{color:var(--mu);font-size:13px}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:8px 0}
.brk .en{font-size:14px}
.brk .bar2{grid-column:1/-1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.brk .bar2 div{height:100%;background:linear-gradient(90deg,var(--a1),var(--hi))}
.ans{direction:ltr;text-align:left;font:600 14px 'Space Grotesk',Cairo,sans-serif;margin-top:2px}
.imgerr{padding:22px 12px;text-align:center;color:var(--bad);line-height:1.6;background:var(--card)}
</style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">هذا التطبيق يحتاج إلى تفعيل JavaScript.</p></noscript>
<div class="w">
<header class="top">
  <div class="lock"><img src="pseudoscience.png" alt="Pseudoscience" width="42" height="42"><span class="x">×</span><img src="logo.webp" alt="Medical Capsule" width="42" height="42"></div>
  <div class="names"><b>Pseudoscience × Medical Capsule</b><small>Anatomy Practical Quiz</small></div>
  <div class="themes" role="group" aria-label="الثيم">
    <button type="button" data-theme-btn="pseudo">Pseudo Practical</button>
    <button type="button" data-theme-btn="medical">Medical Capsule</button>
  </div>
</header>
<div id="app"></div>
</div>

<script>
(function(){
'use strict';

var app = document.getElementById('app');
var WRONG_KEY = 'mc_wrong_v1', CFG_KEY = 'mc_rnd_cfg_v1';

/* ---------- storage helpers (safe) ---------- */
function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- state ---------- */
var DATA = [], MODE = 'mcq', view = 'home';
var Q = [], qi = 0, score = 0, log = [], answered = false, opts = [], ci = 0;
var RUN = { kind:'sec', secId:null, title:'', timer:0, retry:false }, T0 = 0, TMR = null;
var CFG = null, SSEC = null, STUDY_PAGE = 0;
var TIMEOUT = '__timeout__';
var preloaded = {};

/* ---------- themes: pseudo (Pseudo Practical) | medical (Medical Capsule) ---------- */
var THEMES = { pseudo:{ tc:'#0a0609', fav:'favicon.png', h1:'Pseudo Practical' }, medical:{ tc:'#070b1f', fav:'favicon-mc.png', h1:'MEDICAL CAPSULE' } };
function applyTheme(t){
  if(!THEMES[t]) t = 'pseudo';
  document.documentElement.setAttribute('data-theme', t);
  var tc = document.getElementById('tc'), fv = document.getElementById('fav');
  if(tc) tc.setAttribute('content', THEMES[t].tc);
  if(fv) fv.setAttribute('href', THEMES[t].fav);
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-btn]'), function(b){

/* ---------- text helpers ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(a){
  var r = a.slice();
  for(var i = r.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}
function norm(s){
  return String(s || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]+/g, ' ')
    .replace(/\bperoneus\b/g, 'fibularis')
    .replace(/\bperoneal\b/g, 'fibular')
    .replace(/\s+/g, ' ').trim();
}
function lev(a, b){          /* مسافة التحرير مع احتساب تبديل حرفين متجاورين كخطأ واحد */
  if(a === b) return 0;
  var m = a.length, n = b.length, i, j, d = [];
  if(!m) return n;
  if(!n) return m;
  for(i = 0; i <= m; i++){ d[i] = [i]; }
  for(j = 1; j <= n; j++) d[0][j] = j;
  for(i = 1; i <= m; i++){
    for(j = 1; j <= n; j++){
      var c = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if(i > 1 && j > 1 && a.charCodeAt(i - 1) === b.charCodeAt(j - 2) && a.charCodeAt(i - 2) === b.charCodeAt(j - 1)){
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[m][n];
}
function fmtTime(ms){
  var s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60);
  return m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}

/* ---------- structure identity ----------
   tokens(): الاسم بعد إزالة الأقواس والكلمات العامة (of/the/muscle/bone) وتوحيد الجمع والمرادفات.
   نستخدمه لكشف الخيارات المتطابقة المعنى، ولتصحيح الإجابة بالكتابة. */
var STOP = { of:1, the:1, and:1, a:1, an:1, muscle:1, muscles:1, bone:1, bones:1 };
var SYN = { foramina:'foramen', interossei:'interosseus', interosseous:'interosseus', testes:'testis',
  arteries:'artery', veins:'vein', nerves:'nerve', vessels:'vessel', lobes:'lobe', tubules:'tubule',
  ductules:'ductule', ligaments:'ligament', tendons:'tendon', plexuses:'plexus', sinuses:'sinus',
  glands:'gland', cells:'cell', canals:'canal', fissures:'fissure', processes:'process', cartilages:'cartilage' };
function tokens(s){
  var t = norm(String(s || '').replace(/\([^)]*\)/g, ' ').replace(/&/g, ' and '));
  if(!t) return [];
  return t.split(' ').map(function(w){ return SYN[w] || w; }).filter(function(w){ return w && !STOP[w]; });
}
function subset(a, b){
  for(var i = 0; i < a.length; i++) if(b.indexOf(a[i]) < 0) return false;
  return true;
}
/* خياران "متشابهان" إذا كان أحدهما مطابقاً للآخر أو جزءاً منه (مثل Head / Head of femur) */
function confusable(a, b){ return subset(a, b) || subset(b, a); }

/* كلمات تفرّق بين تراكيب مختلفة: يجب أن تُكتب كما هي بالضبط */
var KEY = {};
('internal external anterior posterior superior inferior medial lateral left right deep superficial proximal distal ' +
 'dorsal ventral major minor middle upper lower long short artery vein nerve tendon ligament ' +
 'greater lesser common frontal parietal temporal occipital maxillary mandibular sphenoid ethmoid ' +
 'nasal oral cervical thoracic lumbar sacral cranial facial optic ocular ' +
 'first second third fourth fifth sixth seventh eighth ninth tenth').split(' ')
 .forEach(function(w){ KEY[w] = 1; });

function matches(given, target){
  var a = tokens(given), b = tokens(target);
  if(!a.length || !b.length) return false;
  if(a.slice().sort().join(' ') === b.slice().sort().join(' ')) return true;
  if(a.length !== b.length) return false;
  var edits = 0;
  for(var i = 0; i < a.length; i++){
    if(a[i] === b[i]) continue;
    if(KEY[a[i]] || KEY[b[i]] || /\d/.test(a[i] + b[i])) return false;
    /* temporal / temporalis ، nasal / nasalis ... تراكيب مختلفة وليست خطأ إملائيًا */
    if(a[i].indexOf(b[i]) === 0 || b[i].indexOf(a[i]) === 0) return false;
    var l = Math.max(a[i].length, b[i].length);
    if(l < 5) return false;
    var d = lev(a[i], b[i]);
    if(d > (l >= 9 ? 2 : 1)) return false;
    edits += d;
  }
  return edits <= 2;
}

/* اسم العرض: نحذف أقواس الوصف (isolated) (lateral view) ... ونُبقي الأقواس ذات المعنى */
var QUAL = /^(isolated|lateral|medial|deep|superficial|distal|proximal|dorsum|dorsal|left|right|anterior|posterior|plantar|.*\bview\b.*|.*\blabel\b.*|at\b.*)$/i;
function label(name){
  var s = String(name || '').trim(), prev;
  do{
    prev = s;
    s = s.replace(/\s*\(([^()]*)\)\s*$/, function(m, inner){ return QUAL.test(inner.trim()) ? '' : m; }).trim();
  } while(s !== prev && s);
  return s || String(name || '').trim();
}
function acceptedAnswers(name, alt){
  var out = [name, label(name), name.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim(), name.replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim()];
  var nt = tokens(name).length;
  (alt || []).forEach(function(x){
    var t = tokens(x);
    if(!t.length) return;
    if(QUAL.test(String(x).trim())) return;
    if(t.length < 2 && nt >= 2) return;
    out.push(x);
  });
  return out;
}
function isCorrectText(given, n){
  var g = String(given || '').trim();
  if(!g) return false;
  var gl = g.toLowerCase();
  return n.acc.some(function(a){ return String(a).trim().toLowerCase() === gl || matches(g, a); });
}

/* ---------- data ---------- */
function keepBoxes(v){ return Array.isArray(v) ? v.filter(function(e){ return e && e.length >= 4; }) : []; }
function normalizeSection(s){
  if(!s || s.id == null) return null;
  var sec = { id: String(s.id), en: String(s.en || s.id), ar: String(s.ar || ''), pages: [], items: [], pins: [], soon: false };
  (s.pages || []).forEach(function(p){
    var pins = (p.pins || []).map(function(n){
      var name = String(n.name == null ? '' : n.name).trim();
      var alt = Array.isArray(n.alt) ? n.alt.map(String) : [];
      var tk = tokens(name);
      if(!tk.length) tk = [name.toLowerCase()];
      return {
        n: n.n, name: name, lab: label(name), tk: tk, alt: alt, acc: acceptedAnswers(name, alt),
        ex: keepBoxes(n.ex), xb: keepBoxes(n.xb),
        x: Number(n.x) || 0, y: Number(n.y) || 0,
        sx: Number(n.sx) || 0, sy: Number(n.sy) || 0,
        lx: Number(n.lx) || 0, ly: Number(n.ly) || 0,
        lw: Number(n.lw) || 14, lh: Number(n.lh) || 3.5
      };
    }).filter(function(n){ return n.name; });
    var img = String(p.img || '');
    if(!img || !pins.length) return;
    var page = { img: img, pins: pins, sid: sec.id, cv: p.cv ? 1 : 0, mk: Array.isArray(p.mk) ? p.mk : [] };
    sec.pages.push(page);
    pins.forEach(function(n){
      sec.pins.push(n);
      sec.items.push({ sec: sec, p: page, n: n, key: sec.id + '|' + img + '|' + n.n, ob: null });
    });
  });
  if(!sec.pages.length) sec.soon = true;
  return sec;
}

function seg(sx, sy, x, y){
  var X0 = sx * .75, Y0 = sy, X1 = x * .75, Y1 = y, dx = X1 - X0, dy = Y1 - Y0, L = Math.hypot(dx, dy);
  if(L < 1.5) return '';
  var ux = dx / L, uy = dy / L, h = Math.min(3.6, L * .5), w = h * .45, bx = X1 - ux * h * .9, by = Y1 - uy * h * .9;
  var f = function(v){ return v.toFixed(2); };
  return '<line class="l1" vector-effect="non-scaling-stroke" x1="' + f(X0) + '" y1="' + f(Y0) + '" x2="' + f(bx) + '" y2="' + f(by) + '"/>' +
    '<line class="l2" vector-effect="non-scaling-stroke" x1="' + f(X0) + '" y1="' + f(Y0) + '" x2="' + f(bx) + '" y2="' + f(by) + '"/>' +
    '<polygon vector-effect="non-scaling-stroke" points="' + f(X1) + ',' + f(Y1) + ' ' + f(bx - uy * w) + ',' + f(by + ux * w) + ' ' + f(bx + uy * w) + ',' + f(by - ux * w) + '"/>';
}
function arrowG(n, cls){
  var segs = [[n.sx, n.sy, n.x, n.y]].concat((n.ex || []).map(function(e){ return [e[2], e[3], e[0], e[1]]; }));
  return '<g class="ag ' + (cls || '') + '" data-n="' + esc(String(n.n)) + '">' + segs.map(function(q){ return seg(q[0], q[1], q[2], q[3]); }).join('') + '</g>';
}
function svgWrap(inner){ return '<svg class="ov" viewBox="0 0 75 100" preserveAspectRatio="none" aria-hidden="true">' + inner + '</svg>'; }

function boxStyle(b){ return 'left:' + (b[0] - b[2] / 2).toFixed(3) + '%;top:' + (b[1] - b[3] / 2).toFixed(3) + '%;width:' + b[2] + '%;height:' + b[3] + '%'; }
function coverHtml(p, cur){
  var h = (p.mk || []).map(function(m){ return '<div class="cv mk" style="' + boxStyle(m) + '"></div>'; }).join('');
  (p.all || p.pins).forEach(function(n){
    var c = cur != null && String(n.n) === String(cur);
    [[n.lx, n.ly, n.lw, n.lh]].concat(n.xb || []).forEach(function(b){
      h += '<div class="cv' + (c ? ' cur' : '') + '" style="' + boxStyle(b) + '">' + esc(String(n.n)) + '</div>';
    });
  });
  return h;
}

/* ---- model-page boxes: font scales to the box height; revealed names stay inside their own box ---- */
function fitCvPin(pin, on){
  var box = pin.parentNode; if(!box) return;
  if(pin.getAttribute('data-l') == null){ pin.setAttribute('data-l', pin.style.left); pin.setAttribute('data-w', pin.style.width); }
  pin.style.left = pin.getAttribute('data-l'); pin.style.width = pin.getAttribute('data-w');
  var h = pin.getBoundingClientRect().height, bw = box.clientWidth, base = Math.max(6.5, Math.min(13, h * 0.7));
  pin.style.fontSize = base.toFixed(2) + 'px';
  var lbl = pin.querySelector('.lbl'); if(!on || !lbl) return;
  lbl.style.whiteSpace = ''; lbl.style.maxWidth = '';
  var fs = Math.min(15, Math.max(base, h * 0.62)), fit = false;
  for(; fs >= 6.5; fs -= 0.5){
    pin.style.fontSize = fs.toFixed(1) + 'px';
    if(lbl.scrollWidth <= lbl.clientWidth + 1 && lbl.offsetHeight <= pin.clientHeight - 1){ fit = true; break; }
  }
  if(!fit){
    /* long name in a small box: one line, grow sideways, but only into free space (never over a neighbour box) */
    lbl.style.whiteSpace = 'nowrap'; lbl.style.maxWidth = 'none'; pin.style.fontSize = '6.5px';
    var pr = pin.getBoundingClientRect(), br = box.getBoundingClientRect();
    var cx = pr.left + pr.width / 2, lo = 2, hi = bw - 2;
    Array.prototype.forEach.call(box.querySelectorAll('.pin.cvp'), function(o){
      if(o === pin) return;
      var cs = getComputedStyle(o); if(cs.opacity === '0') return;
      var r = o.getBoundingClientRect();
      if(Math.min(r.bottom, pr.bottom) - Math.max(r.top, pr.top) <= 1) return;
      if(r.left + r.width / 2 < cx) lo = Math.max(lo, r.right - br.left + 0.5);
      else hi = Math.min(hi, r.left - br.left - 0.5);
    });
    var W = Math.min(lbl.offsetWidth + 8, hi - lo), cur = pin.offsetWidth, nl = pin.offsetLeft - (W - cur) / 2;
    nl = Math.max(lo, Math.min(hi - W, nl));
    pin.style.left = (nl / bw * 100).toFixed(3) + '%'; pin.style.width = (W / bw * 100).toFixed(3) + '%';
    for(fs = 6.5; fs > 4 && lbl.offsetWidth > pin.clientWidth - 2; fs -= 0.5) pin.style.fontSize = fs.toFixed(1) + 'px';
  }
}
function sizeCv(root){
  root = root || app;
  Array.prototype.forEach.call(root.querySelectorAll('.cv, .pin.cvp'), function(el){
    var h = el.getBoundingClientRect().height;
    el.style.fontSize = Math.max(6.5, Math.min(13, h * 0.7)).toFixed(2) + 'px';
  });
  Array.prototype.forEach.call(root.querySelectorAll('.pin.cvp.show:not(.xbx)'), function(p){ fitCvPin(p, true); });
}

/* ---------- random quiz: build ---------- */
function uniqFirst(list){
  var seen = {}, u = [], d = [];
  shuffle(list).forEach(function(it){
    var k = it.sec.id + '|' + it.n.tk.slice().sort().join(' ');
    if(seen[k]) d.push(it); else { seen[k] = 1; u.push(it); }
  });
  return { u: u, d: d };
}
function pickQuestions(){
  var WR = CFG.onlyWrong ? wrongMap() : null;
  var parts = selectedSections().map(function(s){
    return uniqFirst(s.items.filter(function(it){ return !WR || WR[it.key]; }));
  });
  var total = parts.reduce(function(a, p){ return a + p.u.length + p.d.length; }, 0);
  var N = CFG.count < 0 ? total : Math.min(CFG.count, total);
  var out = [];
  if(CFG.balanced){
    ['u', 'd'].forEach(function(ph){
      var lists = shuffle(parts.map(function(p){ return p[ph].slice(); }));
      var moved = true;
      while(out.length < N && moved){
        moved = false;
        for(var i = 0; i < lists.length && out.length < N; i++){
          if(lists[i].length){ out.push(lists[i].shift()); moved = true; }
        }
      }
    });
  } else {
    var U = [], D = [];
    parts.forEach(function(p){ U = U.concat(p.u); D = D.concat(p.d); });
    out = shuffle(U).concat(shuffle(D)).slice(0, N);
  }
  return shuffle(out);
}

function beginQuiz(items, run){
  if(!items.length){ alert('لا توجد أسئلة مطابقة للإعدادات.'); return; }

  Q = items; qi = 0; score = 0; log = [];

function start(id){
  var items = [], title = '';
  if(id === 'all'){
    liveSecs().forEach(function(s){ items = items.concat(s.items); });
    title = 'Comprehensive Exam';
  } else if(id === 'hard'){
    var h = getHard();
    liveSecs().forEach(function(s){ s.items.forEach(function(it){ if(h[it.key]) items.push(it); }); });
    title = 'Marked as hard';

/* ---------- options (الخيارات) ---------- */
function buildOptions(cur){
  var n = cur.n, picked = [], keys = [n.tk];
  function can(x){
    for(var i = 0; i < keys.length; i++) if(confusable(x.tk, keys[i])) return false;
    return true;
  }
  function fill(list, max){
    for(var i = 0; i < list.length && picked.length < max; i++){
      var x = list[i];
      if(can(x)){ picked.push(x.lab); keys.push(x.tk); }
    }
  }
  fill(shuffle(cur.p.pins), 2);
  fill(shuffle(cur.sec.pins), 3);
  if(picked.length < 3){
    var others = [];
    liveSecs().forEach(function(s){ if(s !== cur.sec) others = others.concat(s.pins); });
    fill(shuffle(others), 3);
  }
  if(picked.length < 3){            /* احتياط: نكتفي بمنع التطابق التام */
    var all = shuffle(cur.sec.pins);
    for(var i = 0; i < all.length && picked.length < 3; i++){
      var lb = all[i].lab;
      if(lb !== n.lab && picked.indexOf(lb) < 0 && all[i].tk.join(' ') !== n.tk.join(' ')) picked.push(lb);
    }
  }
  var list = shuffle([n.lab].concat(picked));
  return { list: list, ci: list.indexOf(n.lab) };
}

  if(!lbl || !box) return;
  lbl.style.transform = ''; lbl.style.maxWidth = ''; lbl.style.whiteSpace = '';
  var b = box.getBoundingClientRect(), r = lbl.getBoundingClientRect(), m = 6;
  if(r.width > b.width - 2 * m){
    lbl.style.whiteSpace = 'normal';
    lbl.style.maxWidth = Math.max(60, b.width - 2 * m) + 'px';
    r = lbl.getBoundingClientRect();
  }
  var dx = 0, dy = 0;
  if(r.left < b.left + m) dx = b.left + m - r.left;
  else if(r.right > b.right - m) dx = b.right - m - r.right;
  if(r.top < b.top + m) dy = b.top + m - r.top;
  else if(r.bottom > b.bottom - m) dy = b.bottom - m - r.bottom;
  if(dx || dy) lbl.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}
function fitAll(){
  Array.prototype.forEach.call(app.querySelectorAll('.pin.show'), fitLabel);
}
window.addEventListener('resize', fitAll);

/* ---------- load ---------- */
function load(){
  view = 'loading';
  app.innerHTML =
    '<div class="hero">' + lockup() +
      '<h1 class="en">' + THEMES[curTheme()].h1 + '</h1>' +
      '<p class="sub">جارٍ التحميل…</p>' +
    '</div>';

  fetch('data.json?v=5', { cache: 'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      if(!Array.isArray(d) || !d.length) throw new Error('ملف data.json فارغ أو غير صالح');
      DATA = d.map(normalizeSection).filter(Boolean);
      if(!DATA.length) throw new Error('لا توجد أقسام صالحة داخل data.json');
      loadCfg();
      renderHome();
    })
    .catch(function(err){
      view = 'error';
      app.innerHTML =
        '<div class="hero">' + lockup() +
          '<h1 class="en">تعذّر التحميل</h1>' +
          '<p class="sub">' + esc(err && err.message ? err.message : 'خطأ غير معروف') + '</p>' +
          '<p class="sub">تأكد من وجود ملف <span class="en">data.json</span> بجانب الصفحة.</p>' +
          '<div class="bar" style="justify-content:center">' +
            '<button type="button" class="btn" data-act="reload">إعادة المحاولة</button>' +
          '</div>' +
        '</div>';
    });
}

/* ---------- events ---------- */
app.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el || el.disabled) return;
  var act = el.getAttribute('data-act');

  switch(act){
    case 'home':      goHome(); break;
    case 'mode':      MODE = el.getAttribute('data-mode'); renderHome(); break;
    case 'start':     start(el.getAttribute('data-id')); break;
    case 'study':     study(el.getAttribute('data-id'), 0); break;
    case 'pick':      pick(parseInt(el.getAttribute('data-k'), 10)); break;
    case 'check':     check(); break;
    case 'reveal':    if(!answered) finish(false, '—'); break;
    case 'next':      next(); break;
    case 'retry':     retry(); break;
    case 'pin':       togglePin(el.getAttribute('data-n')); break;
    case 'chip':      togglePin(el.getAttribute('data-n')); break;
    case 'star':
      if(!SSEC) break;
      var pg = SSEC.pages[STUDY_PAGE], hk = SSEC.id + '|' + pg.img + '|' + el.getAttribute('data-n'), hh = getHard();
      if(hh[hk]) delete hh[hk]; else hh[hk] = 1;
      lsSet('mc_hard', hh);
      el.classList.toggle('on', !!hh[hk]); el.textContent = hh[hk] ? '★' : '☆';
      var ch = app.querySelector('.chip[data-n="' + el.getAttribute('data-n') + '"]');
      if(ch) ch.classList.toggle('hard', !!hh[hk]);
      break;
    case 'markwrong': markWrong(); break;
    case 'allpins':
      var showAll = !!app.querySelector('.pin:not(.show)');
      var seen = {};
      Array.prototype.forEach.call(app.querySelectorAll('.pin'), function(p){
        var nn = p.getAttribute('data-n');
        if(seen[nn]) return; seen[nn] = 1;
        togglePin(nn, showAll);
      });
      break;
    case 'page':      if(SSEC) study(SSEC.id, parseInt(el.getAttribute('data-page'), 10)); break;
    case 'reload':    load(); break;

    /* random quiz */
    case 'rsetup':    if(!CFG) loadCfg(); renderSetup(); break;
    case 'rsec':
      var id = el.getAttribute('data-id'), at = CFG.secs.indexOf(id);
      if(at > -1) CFG.secs.splice(at, 1); else CFG.secs.push(id);
      saveCfg(); syncSetup(); break;
    case 'rall':      CFG.secs = liveSecs().map(function(s){ return s.id; }); saveCfg(); syncSetup(); break;
    case 'rnone':     CFG.secs = []; saveCfg(); syncSetup(); break;
    case 'rcount':    CFG.count = parseInt(el.getAttribute('data-v'), 10); saveCfg(); syncSetup(); break;
    case 'rtimer':    CFG.timer = parseInt(el.getAttribute('data-v'), 10); saveCfg(); syncSetup(); break;
    case 'rmode':     MODE = el.getAttribute('data-mode'); syncSetup(); break;
    case 'rbal':      CFG.balanced = !CFG.balanced; saveCfg(); syncSetup(); break;
    case 'rwrong':    CFG.onlyWrong = !CFG.onlyWrong; saveCfg(); syncSetup(); break;
    case 'rclear':
      if(window.confirm('مسح سجل الأسئلة التي أخطأت فيها؟')){
        lsSet(WRONG_KEY, {});
        CFG.onlyWrong = false; saveCfg(); syncSetup();
      }
      break;
    case 'rstart':    startRandom(); break;
  }
});

app.addEventListener('input', function(e){
  if(e.target && e.target.id === 'rcount'){
    var v = parseInt(e.target.value, 10);
    if(v > 0){ CFG.count = v; saveCfg(); syncSetup(); }
  }
});

/* صورة فشلت: نعيد المحاولة مرة، ثم نعرض رسالة بدل صورة فارغة */
app.addEventListener('error', function(e){
  var t = e.target;
  if(!t || t.tagName !== 'IMG' || !t.closest || !t.closest('.img,.revimg')) return;
  if(!t.getAttribute('data-retry')){
    t.setAttribute('data-retry', '1');
    t.src = t.src + (t.src.indexOf('?') > -1 ? '&' : '?') + 'r=' + Date.now();
    return;
  }
  if(!t.getAttribute('data-err')){
    t.setAttribute('data-err', '1');
    t.style.display = 'none';
    t.insertAdjacentHTML('afterend', '<div class="imgerr">تعذّر تحميل الصورة. تحقق من الاتصال ثم أعد المحاولة.</div>');
  }
}, true);

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && view !== 'home' && view !== 'loading' && DATA.length){
    goHome();
    return;
  }
  if(view === 'study'){
    if(e.key === 'ArrowLeft' && SSEC) study(SSEC.id, STUDY_PAGE + 1);
    if(e.key === 'ArrowRight' && SSEC) study(SSEC.id, STUDY_PAGE - 1);
    return;
  }
  if(view !== 'quiz') return;

  if(e.key === 'Enter'){
    var ae = document.activeElement;
    if(ae && ae.getAttribute && ae.getAttribute('data-act') === 'next') return;
    e.preventDefault();
    if(answered) next();
    else if(MODE === 'type') check();
    return;
  }

  if(!answered && MODE === 'mcq' && /^[1-9]$/.test(e.key)){
    pick(parseInt(e.key, 10) - 1);
  }
});

load();

})();

</script>
</body>
</html>
